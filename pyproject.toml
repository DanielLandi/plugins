[project]
name = "daniellandi-plugins-dev"
version = "0"
requires-python = ">=3.11"
dependencies = [
  "mutagen>=1.47",
  "numpy>=1.26",
  "pyyaml>=6.0",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-timeout>=2.3"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["music-video/scripts"]
testpaths = ["tests"]
markers = ["studio: needs the installed video engine (music-video doctor)"]
addopts = "-m 'not studio'"
filterwarnings = ["ignore:builtin type .* has no __module__ attribute:DeprecationWarning"]
