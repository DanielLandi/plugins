<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>{{TITLE}} · sections</title>
<style>
  :root {
    --bg: #111317; --panel: #1a1d23; --panel2: #20242b; --line: #2a2e37; --text: #e7e9ee; --dim: #9aa0ab;
    --accent: #ffb547; --play: #5ad1a0; --ink: #ff4d4d; --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, -apple-system, sans-serif; }
  button, select { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 6px;
                   padding: 5px 10px; font: inherit; cursor: pointer; }
  button:hover { border-color: #4a5060; }
  button.on { border-color: var(--accent); color: var(--accent); }
  button.primary { background: var(--accent); color: #17130a; border-color: var(--accent); font-weight: 600; }
  button:disabled { opacity: .45; cursor: default; }
  kbd { font: 11px var(--mono); color: var(--dim); border: 1px solid var(--line); border-radius: 3px; padding: 0 4px;
        margin-left: 4px; }
  .mono { font-family: var(--mono); }
  header { position: sticky; top: 0; z-index: 5; background: rgba(17, 19, 23, .96); border-bottom: 1px solid var(--line);
           padding: 10px 16px 12px; }
  .bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
  h1 { font-size: 17px; margin: 0 6px 0 0; font-weight: 650; }
  h1 small { color: var(--dim); font-weight: 400; margin-left: 6px; font-size: 13px; }
  .now { font: 13px var(--mono); color: var(--dim); margin-left: auto; }
  .now b { color: var(--text); font-weight: 600; }

  /* the flow: every section to scale on the song, with a tick per note */
  .flow { position: relative; display: flex; height: 34px; margin-top: 10px; border-radius: 6px; overflow: hidden;
          border: 1px solid var(--line); cursor: pointer; }
  .flow .seg { position: relative; border-right: 1px solid var(--bg); padding: 3px 5px; font-size: 11px;
               line-height: 1.2; overflow: hidden; white-space: nowrap; color: #0d0f12; }
  .flow .seg:last-of-type { border-right: 0; }
  .flow .seg b { display: block; }
  .flow .seg.cur { outline: 2px solid #fff; outline-offset: -2px; }
  .flow .tick { position: absolute; bottom: 0; width: 2px; height: 9px; background: #111; pointer-events: none; }
  .flow .head { position: absolute; top: 0; bottom: 0; width: 2px; background: #fff; pointer-events: none;
                box-shadow: 0 0 4px #000; }

  /* overview */
  #grid { display: grid; grid-template-columns: repeat(var(--cols, 3), minmax(0, 1fr)); gap: 14px; padding: 14px 16px 40px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden;
          display: flex; flex-direction: column; scroll-margin-top: 110px; }
  .card.cur { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .card.playing { border-color: var(--play); box-shadow: 0 0 0 1px var(--play); }
  .top { display: flex; align-items: baseline; gap: 8px; padding: 8px 10px; }
  .num { font: 600 12px var(--mono); color: #0d0f12; border-radius: 4px; padding: 1px 6px; }
  .name { font-weight: 650; }
  .badge { font-size: 11px; color: #17130a; background: var(--accent); border-radius: 9px; padding: 0 7px; }
  .range { margin-left: auto; color: var(--dim); font: 12px var(--mono); white-space: nowrap; }
  .screen { position: relative; background: #000; aspect-ratio: var(--aspect, 16 / 9); cursor: pointer; overflow: hidden; }
  .screen img, .screen video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; display: block; }
  .screen .t { position: absolute; left: 8px; bottom: 8px; font: 12px var(--mono); background: rgba(0,0,0,.6);
               padding: 1px 6px; border-radius: 4px; }
  .screen .big { position: absolute; inset: 0; display: grid; place-items: center; font-size: 40px; color: #fff;
                 text-shadow: 0 2px 10px #000; opacity: .8; pointer-events: none; }
  .card.playing .big { opacity: 0; }
  .scrub { height: 8px; background: #262a32; cursor: pointer; position: relative; }
  .scrub i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--play); width: 0; pointer-events: none; }
  .scrub .mk { position: absolute; top: -3px; width: 3px; height: 14px; background: var(--accent); border-radius: 1px;
               transform: translateX(-1px); }
  .tools { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px 10px 0; }
  .tools button { padding: 3px 8px; font-size: 12px; }
  .note { color: var(--dim); padding: 6px 10px 0; font-size: 12.5px; }
  .lyrics { padding: 6px 10px 10px; font-size: 13px; }
  .lyrics p { margin: 2px 0; color: #c9cdd5; }
  .lyrics span.sung { color: var(--accent); }
  .lyrics .none { color: var(--dim); font-style: italic; }

  /* a section, large */
  #detail { padding: 12px 16px 30px; }
  .dtop { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; margin-bottom: 10px; }
  .dtop h2 { margin: 0 4px; font-size: 18px; display: flex; align-items: baseline; gap: 8px; }
  .dmain { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 16px; align-items: start; }
  .stage { position: relative; background: #000; border-radius: 8px; overflow: hidden; aspect-ratio: var(--aspect, 16 / 9);
           max-height: calc(100vh - 330px); margin: 0 auto; }
  .stage video, .stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .stage canvas { cursor: crosshair; touch-action: none; }
  .stage .frametag { position: absolute; left: 10px; top: 10px; font: 12px var(--mono); background: rgba(0,0,0,.65);
                     padding: 2px 8px; border-radius: 4px; pointer-events: none; }
  .transport { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; margin: 10px 0 8px; }
  .transport .time { font: 14px var(--mono); margin: 0 6px; }
  .transport .time small { color: var(--dim); }
  .transport .sp { flex: 1; }
  #dscrub { height: 12px; border-radius: 4px; }
  .strip { display: flex; gap: 4px; overflow-x: auto; padding: 8px 0 6px; scroll-behavior: smooth; }
  .strip figure { margin: 0; flex: 0 0 auto; width: 124px; cursor: pointer; position: relative; border-radius: 4px;
                  overflow: hidden; border: 2px solid transparent; }
  .strip figure.cur { border-color: var(--play); }
  .strip img { width: 100%; display: block; aspect-ratio: var(--aspect, 16 / 9); object-fit: cover; background: #000; }
  .strip figcaption { position: absolute; left: 3px; bottom: 3px; font: 10px var(--mono); background: rgba(0,0,0,.6);
                      padding: 0 4px; border-radius: 3px; }
  .strip figure.noted::after { content: ""; position: absolute; right: 4px; top: 4px; width: 9px; height: 9px;
                               border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 2px #000; }
  .about { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 6px; }
  .about .note, .about .lyrics { padding: 0; }
  .inktools { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 10px 0 8px; padding: 6px 8px;
              background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; }
  .inktools .sw { width: 22px; height: 22px; border-radius: 50%; padding: 0; border: 2px solid transparent; }
  .inktools .sw.on { border-color: #fff; }
  .inktools .lbl { color: var(--dim); font-size: 12px; margin-right: 4px; }

  aside.notes { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px;
                position: sticky; top: 12px; max-height: calc(100vh - 24px); display: flex; flex-direction: column; }
  .composer label { display: block; font-size: 12.5px; color: var(--dim); margin-bottom: 6px; }
  .composer label b { color: var(--text); font-family: var(--mono); font-weight: 600; }
  .composer textarea { width: 100%; min-height: 84px; resize: vertical; background: var(--bg); color: var(--text);
                       border: 1px solid var(--line); border-radius: 6px; padding: 8px; font: inherit; }
  .composer textarea:focus { outline: none; border-color: var(--accent); }
  .composer .row { display: flex; gap: 6px; margin-top: 8px; align-items: center; flex-wrap: wrap; }
  .composer .hint { color: var(--dim); font-size: 11.5px; margin-left: auto; }
  .list { margin-top: 14px; overflow-y: auto; flex: 1; }
  .list h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--dim); margin: 0 0 6px; }
  .item { border-top: 1px solid var(--line); padding: 8px 0; display: grid; grid-template-columns: auto 1fr; gap: 4px 8px; }
  .item .when { font: 12px var(--mono); color: var(--accent); background: none; border: 0; padding: 0; cursor: pointer;
                text-align: left; }
  .item .meta { color: var(--dim); font-size: 11.5px; text-align: right; }
  .item .txt { grid-column: 1 / -1; white-space: pre-wrap; }
  .item .txt.empty { color: var(--dim); font-style: italic; }
  .item img { grid-column: 1 / -1; width: 100%; border-radius: 4px; cursor: zoom-in; }
  .item .acts { grid-column: 1 / -1; display: flex; gap: 6px; }
  .item .acts button { font-size: 11.5px; padding: 2px 7px; }
  .item.taken { opacity: .6; }
  .item textarea { grid-column: 1 / -1; width: 100%; min-height: 60px; background: var(--bg); color: var(--text);
                   border: 1px solid var(--accent); border-radius: 6px; padding: 6px; font: inherit; }
  .empty-list { color: var(--dim); font-size: 12.5px; }

  /* every note, from the overview */
  #drawer { position: fixed; top: 0; right: 0; bottom: 0; width: 400px; max-width: 100vw; z-index: 20; background: var(--panel);
            border-left: 1px solid var(--line); padding: 14px; overflow-y: auto; box-shadow: -10px 0 30px rgba(0,0,0,.4); }
  #drawer .item .when { font-size: 12.5px; }
  #lightbox { position: fixed; inset: 0; background: rgba(0,0,0,.88); z-index: 30; display: grid; place-items: center;
              cursor: zoom-out; }
  #lightbox img { max-width: 96vw; max-height: 94vh; }
  #tip { position: fixed; z-index: 50; max-width: 300px; background: #2e333d; color: var(--text); border: 1px solid #454b58;
         border-radius: 6px; padding: 6px 9px; font-size: 12.5px; line-height: 1.35; pointer-events: none;
         box-shadow: 0 6px 18px rgba(0,0,0,.45); }
  .toast { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: #2b303a; padding: 7px 14px;
           border-radius: 6px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 40; }
  .toast.show { opacity: 1; }
  .toast.err { background: #6a2020; }
  @media (max-width: 1200px) { #grid { --cols: 2 !important; } .dmain { grid-template-columns: 1fr; } aside.notes { position: static; max-height: none; } }
  @media (max-width: 700px) { #grid { --cols: 1 !important; } .now { margin-left: 0; } .about { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header>
  <div class="bar">
    <h1>{{TITLE}}<small id="facts"></small></h1>
    <span id="overviewBar" class="bar">
      <button id="flowBtn" data-tip="Play every section in order from the selected one, with no stop between them, the way the video runs (F)">▶ Play the flow<kbd>F</kbd></button>
      <button id="loopBtn" data-tip="Repeat the selected section until you turn this off (L)">↻ Loop section<kbd>L</kbd></button>
      <label data-tip="How many sections per row">Columns <select id="cols"><option>2</option><option selected>3</option><option>4</option></select></label>
    </span>
    <button id="notesBtn" data-tip="Every note on this video: the new ones, and those already taken into a round of NOTES.md">Notes <span id="notesCount"></span></button>
    <span class="now" id="now"></span>
  </div>
  <div class="flow" id="flow"></div>
</header>

<main id="grid"></main>

<section id="detail" hidden>
  <div class="dtop">
    <button id="back" data-tip="Back to every section (Esc)">← All sections</button>
    <button id="prev" data-tip="The section before ([)">‹</button>
    <h2 id="dtitle"></h2>
    <button id="next" data-tip="The next section (])">›</button>
  </div>
  <div class="dmain">
    <div>
      <div class="stage" id="stage">
        <video id="big" preload="auto" playsinline></video>
        <canvas id="ink" hidden></canvas>
        <span class="frametag" id="frametag" hidden></span>
      </div>
      <div class="transport" id="transport">
        <button id="dplay" class="primary" data-tip="Play / pause this section (Space). It stops at the section's end unless Play on is lit">▶ Play</button>
        <button id="fback" data-tip="One frame back (,). ← and → jump a second">⟨ frame</button>
        <button id="ffwd" data-tip="One frame on (.). ← and → jump a second">frame ⟩</button>
        <span class="time" id="dtime"></span>
        <span class="sp"></span>
        <button id="dloop" data-tip="Repeat this section until you turn it off (L)">↻ Loop</button>
        <button id="donward" data-tip="Play on: don't stop at the end of this section. Playback carries on into the next ones and the page follows, as in the video">⇢ Play on</button>
        <button id="drawBtn" data-tip="Pause and draw on this frame at full size to show where something is wrong; the drawing is saved with your note (D)">✎ Draw on frame<kbd>D</kbd></button>
      </div>
      <div class="inktools" id="inktools" hidden>
        <span class="lbl">Draw:</span>
        <button data-tool="pen" data-tip="Draw freely (P)">✎ Pen</button>
        <button data-tool="arrow" data-tip="Drag from where the arrow starts to what it points at (A)">↗ Arrow</button>
        <button data-tool="box" data-tip="Drag a box around something (B)">▭ Box</button>
        <button data-tool="circle" data-tip="Drag a circle around something (O)">◯ Circle</button>
        <span class="lbl" style="margin-left:8px">Colour:</span>
        <span id="swatches"></span>
        <button id="undo" data-tip="Remove the last mark (⌘Z)">↶ Undo</button>
        <button id="clear" data-tip="Remove every mark">Clear</button>
        <span class="sp" style="flex:1"></span>
        <button id="inkCancel" data-tip="Leave the drawing without saving it (Esc)">Cancel</button>
      </div>
      <div class="scrub" id="dscrub" data-tip="Click to jump within this section; the marks are notes"><i></i></div>
      <div class="strip" id="strip"></div>
      <div class="about"><div class="note" id="dnote"></div><div class="lyrics" id="dlyrics"></div></div>
    </div>
    <aside class="notes">
      <div class="composer">
        <label for="text" id="pin"></label>
        <textarea id="text" placeholder="What should change here? Typing pauses the video; the note keeps this frame."></textarea>
        <div class="row">
          <button class="primary" id="save" data-tip="Save the note at this frame (Enter)">Save note</button>
          <span class="hint">Enter saves · Shift+Enter new line · N to write</span>
        </div>
      </div>
      <div class="list" id="list"></div>
    </aside>
  </div>
</section>

<div id="drawer" hidden></div>
<div id="lightbox" hidden><img alt=""></div>
<div class="toast" id="toast"></div>
<div id="tip" role="tooltip" hidden></div>

<script>
const $ = (id) => document.getElementById(id);
const HUES = [205, 160, 45, 330, 25, 270, 120, 0, 185, 300, 85, 230, 350, 140, 60];
const COLOURS = ["#ff4d4d", "#ffd23f", "#3fd0ff", "#ffffff", "#7dff6b"];
const colour = (i) => `hsl(${HUES[i % HUES.length]} 70% 62%)`;
const fmt = (t) => { t = Math.max(0, t); const m = Math.floor(t / 60), s = t - m * 60; return `${m}:${s.toFixed(1).padStart(4, "0")}`; };
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);

let D;                       // the state from the server
let S = [];                  // the sections
const st = { cur: 0, view: "grid", flow: false, loop: false, onward: false, dloop: false, ink: null };
const cards = [];

async function api(body) {
  const r = await fetch("/api/notes", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  const data = await r.json().catch(() => ({ error: `HTTP ${r.status}` }));
  if (!r.ok) throw new Error(data.error || `HTTP ${r.status}`);
  return data;
}

let toastTimer;
function toast(msg, err = false) {
  const t = $("toast"); t.textContent = msg; t.classList.toggle("err", err); t.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), err ? 5000 : 1800);
}

const songOf = (videoT) => D.start + videoT;
const videoOf = (songT) => songT - D.start;
const frameOf = (videoT) => Math.max(0, Math.round(videoT * D.fps - 0.5 + 1e-6));   // the frame shown at videoT
const atFrame = (n) => (n + 0.5) / D.fps;                                            // a time that shows frame n
const sectionAt = (song) => { const i = S.findIndex((s) => song >= s.from && song < s.to); return i < 0 ? S.length - 1 : i; };
const notesIn = (i) => D.notes.filter((n) => n.section === S[i].id).sort((a, b) => a.song - b.song || a.n - b.n);

// ---------------------------------------------------------------- the flow strip
function drawFlow() {
  const flow = $("flow");
  flow.innerHTML = "";
  const total = S[S.length - 1].to - S[0].from;
  S.forEach((s, i) => {
    const d = document.createElement("div");
    d.className = "seg";
    d.style.flex = `${s.to - s.from} 0 0`;
    d.style.background = colour(i);
    d.dataset.tip = `${i + 1} · ${s.id} · ${fmt(s.from)}–${fmt(s.to)}: click to play from there`;
    d.innerHTML = `<b>${i + 1}</b>${esc(s.id)}`;
    flow.append(d);
  });
  for (const n of D.notes) {
    const t = document.createElement("i");
    t.className = "tick";
    t.style.left = `${((n.song - S[0].from) / total) * 100}%`;
    flow.append(t);
  }
  const head = document.createElement("i");
  head.className = "head"; head.id = "head";
  flow.append(head);
}
$("flow").addEventListener("click", (e) => {
  const r = $("flow").getBoundingClientRect();
  const song = S[0].from + ((e.clientX - r.left) / r.width) * (S[S.length - 1].to - S[0].from);
  const i = sectionAt(song);
  if (st.view === "detail") { openSection(i, song); return; }
  playTile(i, song);
});

function showHead(song) {
  const head = $("head");
  if (head) head.style.left = `${((song - S[0].from) / (S[S.length - 1].to - S[0].from)) * 100}%`;
  [...$("flow").querySelectorAll(".seg")].forEach((d, k) => d.classList.toggle("cur", k === st.cur));
  $("now").innerHTML = `<b>${st.cur + 1} · ${esc(S[st.cur].id)}</b> ${fmt(song)}`;
}

// ---------------------------------------------------------------- overview: one player, moved to the playing card
const tileV = document.createElement("video");
tileV.preload = "metadata"; tileV.playsInline = true;

function lyricsHtml(s) {
  const lines = D.lines.filter((ln) => ln.t >= s.from - 0.05 && ln.t < s.to - 0.05);
  if (!lines.length) return `<p class="none">instrumental</p>`;
  return lines.map((ln) => `<p>${ln.words.map((w) => `<span data-t="${w.t}">${esc(w.w)}</span>`).join(" ")}</p>`).join("");
}

function buildGrid() {
  const grid = $("grid");
  grid.innerHTML = "";
  cards.length = 0;
  S.forEach((s, i) => {
    const c = document.createElement("section");
    c.className = "card";
    c.innerHTML = `
      <div class="top"><span class="num" style="background:${colour(i)}">${i + 1}</span><span class="name">${esc(s.id)}</span>
        <span class="badge" hidden></span><span class="range">${fmt(s.from)}–${fmt(s.to)} · ${(s.to - s.from).toFixed(1)} s</span></div>
      <div class="screen"><img alt="" src="${D.posters[i]}"><span class="t">${fmt(s.from)}</span><span class="big">▶</span></div>
      <div class="scrub"><i></i></div>
      <div class="tools"><button data-a="play" data-tip="Play this section on its own; it stops at its end. Pausing keeps your place, even if you play another section (Space)">▶ Play</button>
        <button data-a="open" data-tip="Watch this section large, frame by frame, and leave notes on it (Enter)">⤢ Open &amp; notes</button>
        <button data-a="ctx" data-tip="Play the last 2 s of the section before, this one, and the first 2 s of the next, to see how it joins on both sides">⇄ With neighbours</button></div>
      <div class="note">${esc(s.note)}</div>
      <div class="lyrics">${lyricsHtml(s)}</div>`;
    const card = { el: c, i, s, screen: c.querySelector(".screen"), bar: c.querySelector(".scrub i"), scrub: c.querySelector(".scrub"),
                   t: c.querySelector(".t"), btn: c.querySelector("[data-a=play]"), badge: c.querySelector(".badge"),
                   words: [...c.querySelectorAll(".lyrics span")] };
    card.screen.addEventListener("click", () => toggleTile(i));
    card.btn.addEventListener("click", () => toggleTile(i));
    c.querySelector("[data-a=open]").addEventListener("click", () => openSection(i, tileSongFor(i)));
    c.querySelector("[data-a=ctx]").addEventListener("click", () => neighbours(i));
    c.querySelector(".top").addEventListener("dblclick", () => openSection(i, tileSongFor(i)));
    card.scrub.addEventListener("click", (e) => {
      const r = card.scrub.getBoundingClientRect();
      const song = s.from + ((e.clientX - r.left) / r.width) * (s.to - s.from);
      seekTile(i, song);
    });
    grid.append(c);
    cards.push(card);
  });
  markNotes();
}

function markNotes() {
  cards.forEach((c, i) => {
    const n = notesIn(i).filter((x) => x.round == null).length;
    c.badge.hidden = !n;
    c.badge.textContent = `${n} note${n > 1 ? "s" : ""}`;
    c.scrub.querySelectorAll(".mk").forEach((m) => m.remove());
    for (const x of notesIn(i)) {
      const m = document.createElement("span");
      m.className = "mk";
      m.style.left = `${((x.song - c.s.from) / (c.s.to - c.s.from)) * 100}%`;
      c.scrub.append(m);
    }
  });
  const fresh = D.notes.filter((x) => x.round == null).length;
  $("notesCount").textContent = fresh ? `· ${fresh} new` : `· ${D.notes.length}`;
  $("notesBtn").classList.toggle("on", fresh > 0);
  drawFlow();
}

// Each card remembers where it was left (song time), and keeps showing that frame while the player is elsewhere.
st.resume = {};
function tileHost() { return cards.findIndex((c) => tileV.parentNode === c.screen); }
function leaveCard(j) {
  const c = cards[j], s = S[j], song = songOf(tileV.currentTime);
  const img = c.screen.querySelector("img");
  if (song > s.from + 0.05 && song < s.to - 0.05) {
    st.resume[j] = song;
    try {                                                     // the paused frame, in place of the poster
      const cv = document.createElement("canvas");
      cv.width = 960; cv.height = Math.round(960 * D.size[1] / D.size[0]);
      cv.getContext("2d").drawImage(tileV, 0, 0, cv.width, cv.height);
      img.src = cv.toDataURL("image/jpeg", 0.8);
    } catch (_) { img.src = D.posters[j]; }
  } else {
    delete st.resume[j];
    img.src = D.posters[j];
    c.bar.style.width = "0%"; c.t.textContent = fmt(s.from);
    for (const w of c.words) w.classList.remove("sung");
  }
}
function tileSongFor(i) {
  // where section i would carry on from: the player's time if it is on that card, else where the card was left
  const s = S[i];
  if (tileHost() === i) { const t = songOf(tileV.currentTime); if (t >= s.from && t < s.to - 0.05) return t; }
  return st.resume[i] ?? null;
}

function moveTile(i) {
  // the card it leaves keeps its place, unless playback ran past its end (the flow): then it starts over next time
  const c = cards[i];
  const was = tileHost();
  if (was >= 0 && was !== i) leaveCard(was);
  if (tileV.parentNode !== c.screen) c.screen.insertBefore(tileV, c.screen.querySelector(".t"));  // a move: keeps playing
  cards.forEach((k, j) => { k.el.classList.toggle("cur", j === i); if (j !== i) k.el.classList.remove("playing"); });
  st.cur = i;
  if (cards[i + 1]) new Image().src = D.posters[i + 1];
}

function playTile(i, song = null) {
  st.queue = null;
  setFlow(false);
  startTile(i, song);
}
function startTile(i, song = null, stop = null) {
  const arriving = tileHost() !== i;
  moveTile(i);
  st.stopAt = stop;
  const s = S[i];
  const now = songOf(tileV.currentTime);
  if (song != null) tileV.currentTime = videoOf(song);
  else if (arriving && st.resume[i] != null) tileV.currentTime = videoOf(st.resume[i]);
  else if (now < s.from - 0.01 || now >= s.to - 0.05) tileV.currentTime = videoOf(s.from);
  delete st.resume[i];
  tileV.play().catch(() => {});
  const r = cards[i].el.getBoundingClientRect();
  if (r.top < 110 || r.bottom > innerHeight) cards[i].el.scrollIntoView({ behavior: "smooth", block: "nearest" });
}
function toggleTile(i) {
  if (i === st.cur && tileV.parentNode === cards[i].screen && !tileV.paused) { tileV.pause(); return; }
  if (i === st.cur && tileV.parentNode === cards[i].screen) { tileV.play(); return; }
  playTile(i);
}
function seekTile(i, song) {
  moveTile(i);
  tileV.currentTime = videoOf(song);
}

function neighbours(i) {
  // the last 2 s of the section before, this one, then the first 2 s of the next: how it joins on both sides
  setFlow(false);
  const from = i > 0 ? Math.max(S[i - 1].from, S[i].from - 2) : S[i].from;
  st.queue = "ctx";
  st.ctxEnd = i + 1 < S.length ? Math.min(S[i + 1].to, S[i + 1].from + 2) : S[i].to;
  startTile(sectionAt(from), from);
}

tileV.addEventListener("play", () => { cards[st.cur].el.classList.add("playing"); cards[st.cur].btn.textContent = "❚❚ Pause"; });
tileV.addEventListener("pause", () => { cards.forEach((c) => { c.el.classList.remove("playing"); c.btn.textContent = "▶ Play"; }); });

function tileTick() {
  if (st.view !== "grid" || !tileV.parentNode) return;
  const song = songOf(tileV.currentTime);
  let c = cards[st.cur];
  const s = S[st.cur];
  if (!tileV.paused && song >= s.to - 0.5 / D.fps) {
    const go = st.flow || st.queue === "ctx";
    if (st.queue === "ctx" && song >= st.ctxEnd - 0.5 / D.fps) { tileV.pause(); st.queue = null; }
    else if (go && st.cur + 1 < S.length) { moveTile(st.cur + 1); c = cards[st.cur]; }
    else if (st.loop) tileV.currentTime = videoOf(s.from);
    else { tileV.pause(); tileV.currentTime = videoOf(s.to) - 0.5 / D.fps; if (st.flow) setFlow(false); }
  }
  const cs = c.s;
  c.bar.style.width = `${Math.min(100, ((song - cs.from) / (cs.to - cs.from)) * 100)}%`;
  c.t.textContent = fmt(song);
  for (const w of c.words) w.classList.toggle("sung", +w.dataset.t <= song + 0.02);
  showHead(song);
}

function setFlow(on) {
  st.flow = on;
  $("flowBtn").classList.toggle("on", on);
  $("flowBtn").firstChild.textContent = on ? "❚❚ Stop the flow" : "▶ Play the flow";
}
function setLoop(on) { st.loop = on; $("loopBtn").classList.toggle("on", on); }
$("flowBtn").addEventListener("click", () => {
  if (st.flow) { setFlow(false); tileV.pause(); return; }
  setLoop(false); st.queue = null; setFlow(true);
  startTile(st.cur);
});
$("loopBtn").addEventListener("click", () => setLoop(!st.loop));
$("cols").addEventListener("change", (e) => {
  $("grid").style.setProperty("--cols", e.target.value);
  try { localStorage.setItem("sections.cols", e.target.value); } catch (_) {}
});
try { const c = localStorage.getItem("sections.cols"); if (c) { $("cols").value = c; $("grid").style.setProperty("--cols", c); } } catch (_) {}

// ---------------------------------------------------------------- a section, large
const big = $("big");
let shownFrame = 0;          // the frame on screen, from the video's own frame callbacks when the browser has them

function openSection(i, song = null) {
  tileV.pause();
  leaveInk();
  st.view = "detail";
  st.cur = i;
  const s = S[i];
  $("grid").hidden = true; $("overviewBar").hidden = true; $("detail").hidden = false;
  if (location.hash !== `#${i + 1}`) history.pushState(null, "", `#${i + 1}`);
  $("dtitle").innerHTML = `<span class="num" style="background:${colour(i)}">${i + 1}</span>${esc(s.id)}
    <span class="range">${fmt(s.from)}–${fmt(s.to)} · ${(s.to - s.from).toFixed(1)} s · ${esc(D.render)}</span>`;
  $("prev").disabled = i === 0; $("next").disabled = i === S.length - 1;
  $("dnote").textContent = s.note;
  $("dlyrics").innerHTML = lyricsHtml(s);
  const strip = $("strip");
  strip.innerHTML = "";
  for (const th of D.thumbs) {
    const t = songOf(th.t);
    if (t < s.from - 0.01 || t >= s.to) continue;
    const f = document.createElement("figure");
    f.dataset.t = t;
    f.innerHTML = `<img loading="lazy" alt="" src="${th.src}"><figcaption>${fmt(t)}</figcaption>`;
    f.addEventListener("click", () => seekBig(Math.max(t, s.from)));
    strip.append(f);
  }
  renderList();
  const t = song ?? s.from;
  big.currentTime = atFrame(frameOf(videoOf(t)));
  detailTick(true);
  window.scrollTo(0, 0);
}

function backToGrid() {
  if (st.ink) { leaveInk(); return; }
  big.pause();
  st.view = "grid";
  $("detail").hidden = true; $("grid").hidden = false; $("overviewBar").hidden = false;
  if (location.hash) history.pushState(null, "", location.pathname);
  moveTile(st.cur);
  tileV.currentTime = Math.max(videoOf(S[st.cur].from), Math.min(big.currentTime, videoOf(S[st.cur].to) - 0.05));
  tileTick();
  cards[st.cur].el.scrollIntoView({ block: "nearest" });
}

function seekBig(song) {
  big.currentTime = atFrame(frameOf(videoOf(song)));
}
let pendingFrame = null;     // the frame a step is on its way to, so quick presses add up
function stepFrame(d) {
  big.pause();
  const s = S[st.cur];
  const from = pendingFrame ?? shownFrame;
  const n = Math.max(frameOf(videoOf(s.from)), Math.min(frameOf(videoOf(s.to) - 1e-3), from + d));
  pendingFrame = n;
  big.currentTime = atFrame(n);
}

function detailTick(force = false) {
  if (st.view !== "detail") return;
  const s = S[st.cur];
  let song = songOf(big.currentTime);
  if (!big.paused && song >= s.to - 0.5 / D.fps) {
    if (st.onward && st.cur + 1 < S.length) { const keep = !big.paused; openSection(st.cur + 1, songOf(big.currentTime)); if (keep) big.play(); return; }
    if (st.dloop) big.currentTime = videoOf(s.from);
    else { big.pause(); big.currentTime = atFrame(frameOf(videoOf(s.to) - 1e-3)); }
    song = songOf(big.currentTime);
  }
  if (!("requestVideoFrameCallback" in big)) shownFrame = frameOf(big.currentTime);
  $("dtime").innerHTML = `${fmt(song)} <small>frame ${shownFrame}</small>`;
  $("dscrub").querySelector("i").style.width = `${Math.min(100, ((song - s.from) / (s.to - s.from)) * 100)}%`;
  for (const w of $("dlyrics").querySelectorAll("span")) w.classList.toggle("sung", +w.dataset.t <= song + 0.02);
  let curFig = null;
  for (const f of $("strip").children) { const on = +f.dataset.t <= song + 1e-3; if (on) curFig = f; f.classList.remove("cur"); }
  if (curFig) {
    curFig.classList.add("cur");
    const strip = $("strip");
    if (force || curFig.offsetLeft < strip.scrollLeft || curFig.offsetLeft + curFig.offsetWidth > strip.scrollLeft + strip.clientWidth)
      strip.scrollLeft = curFig.offsetLeft - strip.clientWidth / 3;
  }
  if (!st.ink) $("pin").innerHTML = `Note at <b>${fmt(songOf(shownFrame / D.fps))}</b> · frame ${shownFrame} · ${esc(D.render)}`;
  showHead(song);
}

function trackFrames() {
  if (!("requestVideoFrameCallback" in big)) return;
  const cb = (_, meta) => { shownFrame = Math.round(meta.mediaTime * D.fps); big.requestVideoFrameCallback(cb); };
  big.requestVideoFrameCallback(cb);
}

big.addEventListener("play", () => { $("dplay").textContent = "❚❚ Pause"; });
big.addEventListener("pause", () => {
  // stay on the frame that is on screen, so the clock, the frame number and a note all agree
  $("dplay").textContent = "▶ Play";
  requestAnimationFrame(() => { if (big.paused && "requestVideoFrameCallback" in big) big.currentTime = atFrame(shownFrame); detailTick(); });
});
big.addEventListener("seeked", () => { requestAnimationFrame(() => { pendingFrame = null; }); detailTick(); });
$("dplay").addEventListener("click", () => toggleBig());
function toggleBig() {
  if (st.ink) return;
  if (!big.paused) { big.pause(); return; }
  const s = S[st.cur];
  if (songOf(big.currentTime) >= s.to - 1.5 / D.fps) big.currentTime = videoOf(s.from);
  big.play();
}
$("fback").addEventListener("click", () => stepFrame(-1));
$("ffwd").addEventListener("click", () => stepFrame(1));
$("dloop").addEventListener("click", () => { st.dloop = !st.dloop; $("dloop").classList.toggle("on", st.dloop); if (st.dloop) { st.onward = false; $("donward").classList.remove("on"); } });
$("donward").addEventListener("click", () => { st.onward = !st.onward; $("donward").classList.toggle("on", st.onward); if (st.onward) { st.dloop = false; $("dloop").classList.remove("on"); } });
$("dscrub").addEventListener("click", (e) => {
  const r = $("dscrub").getBoundingClientRect(), s = S[st.cur];
  seekBig(s.from + ((e.clientX - r.left) / r.width) * (s.to - s.from));
});
$("back").addEventListener("click", backToGrid);
$("prev").addEventListener("click", () => st.cur > 0 && openSection(st.cur - 1));
$("next").addEventListener("click", () => st.cur + 1 < S.length && openSection(st.cur + 1));

// ---------------------------------------------------------------- notes
function renderList() {
  const list = $("list");
  const mine = notesIn(st.cur);
  const s = S[st.cur];
  // markers on the section's scrub bar and its filmstrip
  $("dscrub").querySelectorAll(".mk").forEach((m) => m.remove());
  for (const x of mine) {
    const m = document.createElement("span");
    m.className = "mk";
    m.style.left = `${((x.song - s.from) / (s.to - s.from)) * 100}%`;
    $("dscrub").append(m);
  }
  const figs = [...$("strip").children];
  figs.forEach((f) => f.classList.remove("noted"));
  for (const x of mine) {
    let hit = null;
    for (const f of figs) if (+f.dataset.t <= x.song + 1e-3) hit = f;
    hit?.classList.add("noted");
  }
  list.innerHTML = `<h3>Notes on this section</h3>`;
  if (!mine.length) list.insertAdjacentHTML("beforeend", `<p class="empty-list">None yet. Pause where something should change and write it down; ✎ draws on the frame.</p>`);
  for (const x of mine) list.append(noteItem(x, false));
}

function noteItem(x, withSection) {
  const el = document.createElement("div");
  el.className = "item" + (x.round != null ? " taken" : "");
  const i = S.findIndex((s) => s.id === x.section);
  const where = withSection && i >= 0 ? `${i + 1} ${esc(x.section)} · ` : "";
  const img = x.marked || x.image;
  el.innerHTML = `
    <button class="when" data-tip="Go to this frame">${where}${fmt(x.song)} · frame ${x.frame}</button>
    <span class="meta">${x.round != null ? `Round ${x.round}` : esc(x.id)} · ${esc(x.render)}</span>
    <div class="txt${x.text ? "" : " empty"}">${x.text ? esc(x.text) : "a drawing"}</div>
    ${img ? `<img alt="the frame with the drawing" src="/notes/${img}">` : ""}
    ${x.round == null ? `<div class="acts"><button data-a="edit" data-tip="Change the words">Edit</button><button data-a="del" data-tip="Delete this note and its frames (click twice)">Delete</button></div>` : ""}`;
  el.querySelector(".when").addEventListener("click", () => goToNote(x));
  el.querySelector("img")?.addEventListener("click", () => { $("lightbox").querySelector("img").src = `/notes/${img}`; $("lightbox").hidden = false; });
  el.querySelector("[data-a=edit]")?.addEventListener("click", () => editNote(el, x));
  const del = el.querySelector("[data-a=del]");
  del?.addEventListener("click", async () => {
    if (!del.dataset.sure) { del.dataset.sure = "1"; del.textContent = "Delete it?"; setTimeout(() => { delete del.dataset.sure; del.textContent = "Delete"; }, 3000); return; }
    try { update(await api({ action: "delete", id: x.id })); toast("Note deleted"); } catch (e) { toast(e.message, true); }
  });
  return el;
}

function editNote(el, x) {
  const txt = el.querySelector(".txt");
  const ta = document.createElement("textarea");
  ta.value = x.text;
  txt.replaceWith(ta);
  ta.focus();
  const acts = el.querySelector(".acts");
  acts.innerHTML = `<button data-a="ok" class="primary">Save</button><button data-a="no">Cancel</button>`;
  const done = async (save) => {
    if (save) { try { update(await api({ action: "edit", id: x.id, text: ta.value })); toast("Note saved"); return; } catch (e) { toast(e.message, true); return; } }
    renderAll();
  };
  acts.querySelector("[data-a=ok]").addEventListener("click", () => done(true));
  acts.querySelector("[data-a=no]").addEventListener("click", () => done(false));
  ta.addEventListener("keydown", (e) => {
    e.stopPropagation();
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); done(true); }
    if (e.key === "Escape") done(false);
  });
}

function goToNote(x) {
  $("drawer").hidden = true;
  const i = S.findIndex((s) => s.id === x.section);
  const song = songOf(x.frame / D.fps);
  if (st.view !== "detail" || st.cur !== i) openSection(i >= 0 ? i : sectionAt(x.song), song);
  big.pause();
  big.currentTime = atFrame(x.frame);
}

function update(data) {
  D.notes = data.notes;
  renderAll();
}
function renderAll() {
  markNotes();
  if (st.view === "detail") renderList();
  if (!$("drawer").hidden) renderDrawer();
}

async function saveNote() {
  const text = $("text").value.trim();
  const drawing = st.ink ? st.ink.strokes : [];
  if (!text && !drawing.length) { toast("Write what should change (or draw on the frame) first", true); $("text").focus(); return; }
  const body = { action: "add", frame: st.ink ? st.ink.frame : shownFrame, text, drawing };
  if (st.ink && drawing.length) body.marked = composite();
  $("save").disabled = true;
  try {
    const data = await api(body);
    $("text").value = "";
    $("text").blur();
    leaveInk();
    update(data);
    toast(`Saved ${data.note.id} at ${fmt(data.note.song)}`);
  } catch (e) { toast(e.message, true); }
  finally { $("save").disabled = false; }
}
$("save").addEventListener("click", saveNote);
$("text").addEventListener("focus", () => { big.pause(); });
$("text").addEventListener("input", () => { if (!big.paused) big.pause(); });
$("text").addEventListener("keydown", (e) => {
  e.stopPropagation();
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); saveNote(); }
  else if (e.key === "Escape") $("text").blur();
  else if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "z" && st.ink && !$("text").value) { e.preventDefault(); undoInk(); }
});

function renderDrawer() {
  const d = $("drawer");
  d.innerHTML = `<div class="bar" style="margin-bottom:8px"><h1 style="font-size:15px">Notes</h1><span class="sp" style="flex:1"></span><button id="drawerClose">Close</button></div>
    <p class="empty-list">New notes go to Claude with <span class="mono">music-video notes ${esc(D.id)}</span>; taken ones show their round.</p>`;
  const all = [...D.notes].sort((a, b) => (a.round != null) - (b.round != null) || a.song - b.song || a.n - b.n);
  if (!all.length) d.insertAdjacentHTML("beforeend", `<p class="empty-list">No notes yet: open a section to leave one.</p>`);
  for (const x of all) d.append(noteItem(x, true));
  $("drawerClose").addEventListener("click", () => { d.hidden = true; });
}
$("notesBtn").addEventListener("click", () => { const d = $("drawer"); d.hidden = !d.hidden; if (!d.hidden) renderDrawer(); });
$("lightbox").addEventListener("click", () => { $("lightbox").hidden = true; });

// ---------------------------------------------------------------- drawing on a frame
const ink = $("ink");
const inkState = { tool: "pen", colour: COLOURS[0] };
const W = 6;                                      // stroke width, in 1000-units of the frame's width

$("swatches").innerHTML = COLOURS.map((c, k) => `<button class="sw${k ? "" : " on"}" data-c="${c}" style="background:${c}" data-tip="Draw in this colour"></button>`).join("");
$("swatches").addEventListener("click", (e) => {
  const c = e.target.dataset?.c; if (!c) return;
  inkState.colour = c;
  $("swatches").querySelectorAll(".sw").forEach((b) => b.classList.toggle("on", b.dataset.c === c));
});
$("inktools").addEventListener("click", (e) => { const t = e.target.closest("[data-tool]")?.dataset.tool; if (t) setTool(t); });
function setTool(t) {
  inkState.tool = t;
  $("inktools").querySelectorAll("[data-tool]").forEach((b) => b.classList.toggle("on", b.dataset.tool === t));
}
setTool("pen");

async function enterInk() {
  if (st.view !== "detail" || st.ink) return;
  big.pause();
  const frame = shownFrame;
  const img = new Image();
  img.src = `/frame?n=${frame}`;
  $("drawBtn").disabled = true;
  try { await img.decode(); } catch (_) { toast("Could not get that frame from the render", true); $("drawBtn").disabled = false; return; }
  $("drawBtn").disabled = false;
  st.ink = { frame, img, strokes: [], live: null };
  ink.hidden = false;
  $("inktools").hidden = false; $("transport").hidden = true;
  $("frametag").hidden = false;
  $("frametag").textContent = `drawing on frame ${frame} · ${fmt(songOf(frame / D.fps))} · full size`;
  $("pin").innerHTML = `Note at <b>${fmt(songOf(frame / D.fps))}</b> · frame ${frame} · with a drawing`;
  sizeInk();
  $("text").placeholder = "What is wrong where you drew? Enter saves the note with the drawing.";
}
function leaveInk() {
  if (!st.ink) return;
  st.ink = null;
  ink.hidden = true;
  $("inktools").hidden = true; $("transport").hidden = false; $("frametag").hidden = true;
  $("text").placeholder = "What should change here? Typing pauses the video; the note keeps this frame.";
  detailTick();
}
$("drawBtn").addEventListener("click", enterInk);
$("inkCancel").addEventListener("click", leaveInk);
$("undo").addEventListener("click", undoInk);
$("clear").addEventListener("click", () => { if (st.ink) { st.ink.strokes = []; paintInk(); } });
function undoInk() { if (st.ink) { st.ink.strokes.pop(); paintInk(); } }

// the frame's box inside the stage (letterboxed like the video)
function frameBox() {
  const r = ink.getBoundingClientRect();
  const iw = st.ink.img.naturalWidth, ih = st.ink.img.naturalHeight;
  const k = Math.min(r.width / iw, r.height / ih);
  const w = iw * k, h = ih * k;
  return { x: (r.width - w) / 2, y: (r.height - h) / 2, w, h, r };
}
function sizeInk() {
  if (!st.ink) return;
  const r = ink.getBoundingClientRect(), dpr = devicePixelRatio || 1;
  ink.width = Math.round(r.width * dpr); ink.height = Math.round(r.height * dpr);
  paintInk();
}
addEventListener("resize", sizeInk);

function drawStroke(ctx, s, k, ox = 0, oy = 0) {
  const P = s.points.map(([x, y]) => [ox + x * k, oy + y * k]);
  ctx.strokeStyle = s.colour; ctx.fillStyle = s.colour;
  ctx.lineWidth = W * k; ctx.lineCap = "round"; ctx.lineJoin = "round";
  ctx.beginPath();
  if (s.tool === "pen") {
    P.forEach(([x, y], j) => (j ? ctx.lineTo(x, y) : ctx.moveTo(x, y)));
    if (P.length === 1) ctx.lineTo(P[0][0] + 0.1, P[0][1]);
    ctx.stroke();
    return;
  }
  const [[x0, y0], [x1, y1]] = [P[0], P[P.length - 1]];
  if (s.tool === "box") { ctx.strokeRect(Math.min(x0, x1), Math.min(y0, y1), Math.abs(x1 - x0), Math.abs(y1 - y0)); return; }
  if (s.tool === "circle") {
    ctx.ellipse((x0 + x1) / 2, (y0 + y1) / 2, Math.abs(x1 - x0) / 2 || 1, Math.abs(y1 - y0) / 2 || 1, 0, 0, Math.PI * 2);
    ctx.stroke(); return;
  }
  // arrow: the line, then a head at the end
  ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke();
  const a = Math.atan2(y1 - y0, x1 - x0), L = W * k * 4;
  ctx.beginPath();
  ctx.moveTo(x1, y1);
  ctx.lineTo(x1 - L * Math.cos(a - 0.45), y1 - L * Math.sin(a - 0.45));
  ctx.lineTo(x1 - L * Math.cos(a + 0.45), y1 - L * Math.sin(a + 0.45));
  ctx.closePath(); ctx.fill();
}

function paintInk() {
  if (!st.ink) return;
  const ctx = ink.getContext("2d"), dpr = devicePixelRatio || 1;
  const b = frameBox();
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = "#000"; ctx.fillRect(0, 0, b.r.width, b.r.height);
  ctx.drawImage(st.ink.img, b.x, b.y, b.w, b.h);
  const k = b.w / 1000;
  for (const s of st.ink.strokes) drawStroke(ctx, s, k, b.x, b.y);
  if (st.ink.live) drawStroke(ctx, st.ink.live, k, b.x, b.y);
}

function toUnits(e) {
  const b = frameBox();
  const k = 1000 / b.w;
  return [Math.round(((e.clientX - b.r.left - b.x) * k) * 10) / 10, Math.round(((e.clientY - b.r.top - b.y) * k) * 10) / 10];
}
ink.addEventListener("pointerdown", (e) => {
  if (!st.ink) return;
  ink.setPointerCapture(e.pointerId);
  st.ink.live = { tool: inkState.tool, colour: inkState.colour, points: [toUnits(e)] };
  paintInk();
});
ink.addEventListener("pointermove", (e) => {
  const live = st.ink?.live; if (!live) return;
  const p = toUnits(e);
  if (live.tool === "pen") live.points.push(p); else live.points[1] = p;
  paintInk();
});
const endStroke = () => {
  const live = st.ink?.live; if (!live) return;
  st.ink.live = null;
  if (live.tool !== "pen" && live.points.length < 2) live.points.push(live.points[0]);
  st.ink.strokes.push(live);
  paintInk();
  $("text").focus();
};
ink.addEventListener("pointerup", endStroke);
ink.addEventListener("pointercancel", endStroke);

function composite() {
  // the frame at full size with the drawing on it, as the note's image
  const img = st.ink.img, c = document.createElement("canvas");
  c.width = img.naturalWidth; c.height = img.naturalHeight;
  const ctx = c.getContext("2d");
  ctx.drawImage(img, 0, 0);
  for (const s of st.ink.strokes) drawStroke(ctx, s, c.width / 1000);
  return c.toDataURL("image/jpeg", 0.9);
}

// ---------------------------------------------------------------- keys and the loop
addEventListener("keydown", (e) => {
  if (e.target.closest("select, textarea, input") || e.metaKey || e.ctrlKey || e.altKey) {
    if (st.ink && (e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "z") { e.preventDefault(); undoInk(); }
    return;
  }
  const k = e.key;
  if (!$("lightbox").hidden) { if (k === "Escape") $("lightbox").hidden = true; return; }
  if (st.view === "grid") {
    if (k === " ") { e.preventDefault(); toggleTile(st.cur); }
    else if (k === "ArrowRight") { e.preventDefault(); playTile(Math.min(S.length - 1, st.cur + 1)); }
    else if (k === "ArrowLeft") { e.preventDefault(); playTile(Math.max(0, st.cur - 1)); }
    else if (k === "Enter") openSection(st.cur, tileSongFor(st.cur));
    else if (k === "f" || k === "F") $("flowBtn").click();
    else if (k === "l" || k === "L") $("loopBtn").click();
    else if (k === "Escape") $("drawer").hidden = true;
    return;
  }
  if (st.ink) {
    const tools = { p: "pen", a: "arrow", b: "box", o: "circle" };
    if (tools[k.toLowerCase()]) setTool(tools[k.toLowerCase()]);
    else if (k === "Escape") leaveInk();
    else if (k === "n" || k === "N") { e.preventDefault(); $("text").focus(); }
    return;
  }
  if (k === " ") { e.preventDefault(); toggleBig(); }
  else if (k === ",") stepFrame(-1);
  else if (k === ".") stepFrame(1);
  else if (k === "ArrowLeft") { e.preventDefault(); seekBig(Math.max(S[st.cur].from, songOf(big.currentTime) - 1)); }
  else if (k === "ArrowRight") { e.preventDefault(); seekBig(Math.min(S[st.cur].to - 0.01, songOf(big.currentTime) + 1)); }
  else if (k === "[") $("prev").click();
  else if (k === "]") $("next").click();
  else if (k === "d" || k === "D") enterInk();
  else if (k === "n" || k === "N") { e.preventDefault(); $("text").focus(); }
  else if (k === "l" || k === "L") $("dloop").click();
  else if (k === "Escape") backToGrid();
});

addEventListener("popstate", () => {
  const i = parseInt(location.hash.slice(1), 10) - 1;
  if (i >= 0 && i < S.length) openSection(i); else if (st.view === "detail") backToGrid();
});

// tooltips: what a button does, shown a moment after the pointer (or the keyboard focus) reaches it
const tip = $("tip");
let tipTimer, tipFor = null;
function showTip(el) {
  tipFor = el;
  tip.textContent = el.dataset.tip;
  tip.hidden = false;
  const r = el.getBoundingClientRect(), t = tip.getBoundingClientRect();
  let x = Math.min(Math.max(8, r.left + r.width / 2 - t.width / 2), innerWidth - t.width - 8);
  let y = r.bottom + 8;
  if (y + t.height > innerHeight - 8) y = r.top - t.height - 8;
  tip.style.left = `${x}px`; tip.style.top = `${y}px`;
}
function hideTip() { clearTimeout(tipTimer); tip.hidden = true; tipFor = null; }
document.addEventListener("pointerover", (e) => {
  const el = e.target.closest?.("[data-tip]");
  if (el === tipFor) return;
  hideTip();
  if (el) tipTimer = setTimeout(() => showTip(el), 350);
});
document.addEventListener("focusin", (e) => { const el = e.target.closest?.("[data-tip]"); if (el && e.target.matches(":focus-visible")) showTip(el); });
document.addEventListener("focusout", hideTip);
document.addEventListener("pointerdown", hideTip);
addEventListener("keydown", hideTip, true);
addEventListener("scroll", hideTip, true);

function loop() { tileTick(); detailTick(); requestAnimationFrame(loop); }

async function start() {
  D = await (await fetch("/api/state")).json();
  S = D.sections;
  document.documentElement.style.setProperty("--aspect", `${D.size[0]} / ${D.size[1]}`);
  $("facts").textContent = ` · ${D.render} · ${S.length} sections · ${fmt(S[S.length - 1].to - S[0].from)}`;
  tileV.src = "/video";
  big.src = "/video";
  trackFrames();
  buildGrid();
  moveTile(0);
  tileV.addEventListener("loadedmetadata", () => { if (tileV.currentTime < videoOf(S[0].from)) tileV.currentTime = videoOf(S[0].from); }, { once: true });
  const i = parseInt(location.hash.slice(1), 10) - 1;
  if (i >= 0 && i < S.length) openSection(i);
  loop();
}
window.sections = { st, get D() { return D; }, ready: start().catch((e) => { toast(`Could not load: ${e.message}`, true); throw e; }) };
</script>
</body>
