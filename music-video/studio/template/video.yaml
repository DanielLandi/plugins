id: __ID__
# concept | lyrics | song | timing | look | sample | production | delivery | done
step: concept
# What the user is asked for now, in a few words ("pick a lyric"); empty once answered. The home shows it.
waiting: ""
# The user's topic, when the video was asked for on the home.
topic: ""
lang: en
# Word starts on the first sound (hiss, burst or voice), measured on the vocals. Videos made before 0.8.3 have no
# such line and keep their timing; set it to true to switch one on.
onsets: true
# none | lines | words, decided at step 6 (also set in look.ts)
subtitles: null
# Step 5's jolts question (also in look.ts and LOOK.md): true only when the user wants things to jolt on the beat
# (a camera kick on the kick drum, a shake on hits). Unanswered means false.
jolts: false
# Step 5's character engine when the video has characters (also in look.ts and LOOK.md): raw (drawn from scratch in
# scene code), vrm (three-vrm anime avatars) or cartoon (brush-ink rubber-hose rig). null: no characters.
characters: null
# One --gl mode for every render of this video (angle uses the GPU; swangle is the software fallback).
gl: angle
# Designed still or black stretches qc must accept, as [start, end] seconds.
holds: []
# Designed hard cuts inside a scene (a camera key with ease: 'cut'), in song seconds: qc's hard-cut scan accepts
# them (scene changes are read from analysis.json).
cuts: []
# A silent placeholder song for working on the picture before the song exists ({seconds, bpm}), set by
# `music-video placeholder`. Filing the real song and running align replaces it (and sets this to null).
placeholder: null
checklist:
  - concept approved
  - lyrics approved
  - take picked, downloaded, ingested
  - timing approved (preview watched)
  - look approved
  - sample, storyboard and subtitles approved (go)
  - draft approved
  - delivered and committed
