id: __ID__
# concept | lyrics | song | timing | look | sample | production | delivery | done
step: concept
# What the user is asked for now, in a few words ("pick a lyric"); empty once answered. The home shows it.
waiting: ""
# The user's topic, when the video was asked for on the home.
topic: ""
lang: en
# Word starts on the first sound (hiss, burst or voice), measured on the vocals. Videos made before 0.8.3 have no
# such line and keep their timing; set it to true to switch one on.
onsets: true
# none | lines | words, decided at step 6 (also set in look.ts)
subtitles: null
# One --gl mode for every render of this video (angle uses the GPU; swangle is the software fallback).
gl: angle
# Designed still or black stretches qc must accept, as [start, end] seconds.
holds: []
checklist:
  - concept approved
  - lyrics approved
  - take picked, downloaded, ingested
  - timing approved (preview watched)
  - look approved
  - sample, storyboard and subtitles approved (go)
  - draft approved
  - delivered and committed
